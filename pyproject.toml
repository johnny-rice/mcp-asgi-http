[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-asgi-http"
version = "0.1.0"
description = "ASGI glue for remote MCP — mount Streamable HTTP beside your API with pluggable auth."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Johnny Rice" }]
keywords = ["mcp", "asgi", "streamable-http", "fastapi", "starlette", "lambda", "mangum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.0",
    "anyio>=4.0",
    "starlette>=0.27",
]

[project.optional-dependencies]
jwt = ["PyJWT[crypto]>=2.8"]
dev = [
    "mcp-asgi-http[jwt]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mangum>=0.17",
]

[project.urls]
Homepage = "https://github.com/johnny-rice/mcp-asgi-http"
Repository = "https://github.com/johnny-rice/mcp-asgi-http"
Issues = "https://github.com/johnny-rice/mcp-asgi-http/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_asgi_http"]

[tool.hatch.build.targets.sdist]
include = ["src/mcp_asgi_http", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
