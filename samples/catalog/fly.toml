# Deploy from repo root:
#   fly apps create mcp-asgi-http-catalog
#   fly secrets set SITE_URL=https://mcp-asgi-http-catalog.fly.dev
#   fly deploy -c samples/catalog/fly.toml

app = "mcp-asgi-http-catalog"
primary_region = "iad"

[build]
  dockerfile = "samples/catalog/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"
  method = "GET"
  path = "/health"
